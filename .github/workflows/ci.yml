# ============================================================
# AI-Generated GitHub Actions CI/CD Workflow
# Repo: multilang-java-maven | Env: dev
# Stack: java / spring-boot / maven
# AI Decisions: base=eclipse-temurin:17-jre-alpine port=8080
# Generated by Backstage AI DevOps Scaffolder
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: njse2etest2
  DOCKER_IMAGE: jaykumark7/njse2etest2
  DEPLOY_ENV: dev
  DEPLOY_NAMESPACE: dev
  APP_PORT: "8080"
  
permissions:
  contents: read
  packages: read
jobs:
  # ─────────────────────────────────────────────────────────
  # CI — Setup + Build + Test + SonarQube (all branches)
  # ─────────────────────────────────────────────────────────
  ci:
    name: CI — Build & Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/package.json', '**/go.sum', '**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-maven-

      # AI-decided: setup for java/maven
      - name: Setup Environment
        run: |
          echo "Maven project — no extra setup needed"

      # AI-decided: build
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.JK7_PACKAGES_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          mvn clean package -DskipTests -B -s settings.xml

      # AI-decided: test
      - name: Run Tests
        run: |
          mvn test -B

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: target/*.war

      # SonarQube — language-specific flags for java
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.APP_NAME }}
            -Dsonar.java.binaries=target/classes -Dsonar.sources=src/main/java

  # ─────────────────────────────────────────────────────────
  # CD — Docker Build + Push + GitOps Update (main only)
  # ─────────────────────────────────────────────────────────
  cd:
    name: CD — Docker & GitOps
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG=${{ env.DOCKER_IMAGE }}:1.0.${{ github.run_number }}
          docker build --build-arg CONTEXT_PATH=${{ env.APP_NAME }}-${{ env.DEPLOY_NAMESPACE }} -t $IMAGE_TAG -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push $IMAGE_TAG
          docker push ${{ env.DOCKER_IMAGE }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update GitOps Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 https://$GH_PAT@github.com/jk7testorg/k8s-manifest.git gitops
          cd gitops
          mkdir -p argocd apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}
          cp ../manifest-templates/application.yaml argocd/${{ env.APP_NAME }}-${{ env.DEPLOY_ENV }}.yaml || true
          cp ../manifest-templates/deployment.yaml  apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          cp ../manifest-templates/service.yaml     apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          cp ../manifest-templates/ingress.yaml     apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          for f in apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/*.yaml argocd/${{ env.APP_NAME }}-${{ env.DEPLOY_ENV }}.yaml; do
            [ -f "$f" ] || continue
            sed -i "s|\${APP_NAME}|${{ env.APP_NAME }}|g"          "$f"
            sed -i "s|\${DOCKER_IMAGE}|${{ env.IMAGE_TAG }}|g"     "$f"
            sed -i "s|\${APP_PORT}|${{ env.APP_PORT }}|g"          "$f"
            sed -i "s|\${NAMESPACE}|${{ env.DEPLOY_NAMESPACE }}|g" "$f"
          done
          git config user.email "gha@local"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet || git commit -m "[${{ env.DEPLOY_ENV }}] Deploy ${{ env.APP_NAME }} run ${{ github.run_number }}"
          git push
